name: Build portable package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore DellSmmFanControl.sln
      - name: Build
        run: dotnet build DellSmmFanControl.sln -c Release --no-restore --nologo -warnaserror
      - name: Package without hardware access
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DellSmmFanControl-packages
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 14
